schema: spec-driven

context: |
  Godot 4.6 addon (GL Compatibility) for isometric pre-rendered pixel art.
  Lighting lives in addons/godot-pixel-core/lighting/: iso_lit.gdshader for
  surfaces, iso_shadow.gdshader for ground quads, IsoLightingConfig for
  global look knobs. No SpriteLighting autoload; values are shader globals.

  shadow_map.png is a ground-plane occupancy field, not a silhouette:
  R = bottom, G = top (1 step = 1 px), A = coverage. IsoGroundShadow draws
  a blend_sub quad on the floor and ray-marches that field toward each light.

  Receivers already have height.png (R = height above ground, 1 step = 1 px)
  and world-space normal.png. iso_lit writes LIGHT_VERTEX as
  (ground_xy, height). Do not add a facing or screen-height channel to the
  shadow map.

  Tests are scene probes under test/ that print PROBE_* lines and quit.

  Keep pixel-art nearest filtering. Prefer measured probes over visual-only checks.
